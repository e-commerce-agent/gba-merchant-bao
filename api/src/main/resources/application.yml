server:
  port: 8080

spring:
  servlet:
    multipart:
      # Resolve after route selection, so the knowledge advice can return our 413 envelope.
      resolve-lazily: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${merchant.datasource.driver-class-name}
    url: jdbc:mysql://${merchant.datasource.host}:${merchant.datasource.port}/${merchant.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${merchant.datasource.username}
    password: ${merchant.datasource.password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    baseline-on-migrate: false
    baseline-version: 1
  data:
    redis:
      host: ${merchant.redis.host}
      port: ${merchant.redis.port}
      database: ${merchant.redis.database}

springdoc:
  api-docs:
    enabled: ${merchant.openapi.enabled:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${merchant.openapi.enabled:true}
    path: /swagger-ui.html
  packages-to-scan: com.gba.merchantbao.legacy,com.gba.merchantbao.api,com.gba.merchantbao.auth.controller,com.gba.merchantbao.chat.controller,com.gba.merchantbao.knowledge.controller,com.gba.merchantbao.shipment.controller,com.gba.merchantbao.product.controller,com.gba.merchantbao.inventory.controller,com.gba.merchantbao.order.controller

mybatis:
  #mapper配置文件
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.gba.merchantbao.legacy.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  file:
    path: ${LOG_DIR:.runtime/logs}
  level:
    com.gba.merchantbao.legacy.mapper: debug
    com.gba.merchantbao.legacy.service: info
    com.gba.merchantbao.legacy.controller: info

merchant:
  rag:
    enabled: ${MERCHANT_RAG_ENABLED:false}
    embedding-base-url: ${RAG_EMBEDDING_BASE_URL:}
    embedding-api-key: ${RAG_EMBEDDING_API_KEY:}
    embedding-model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimension: ${RAG_EMBEDDING_DIMENSION:1536}
    milvus-uri: ${RAG_MILVUS_URI:http://127.0.0.1:19530}
    milvus-token: ${RAG_MILVUS_TOKEN:}
    collection: ${RAG_COLLECTION:knowledge_text_embedding_3_small}
  agent:
    enabled: false
    prompt-version: assistant-v1
  id:
    # Single-instance default. Concurrent instances sharing a database need distinct worker IDs.
    worker-id: ${MERCHANT_ID_WORKER_ID:0}
  openapi:
    enabled: true
  product:
    # High-concurrency landing point: public catalog is cached in Redis; set false to bypass.
    cache-enabled: ${MERCHANT_PRODUCT_CACHE_ENABLED:true}
  jwt:
    admin-secret-key: ${merchant.auth.jwt.merchant-staff-secret-base64}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${merchant.auth.jwt.consumer-secret-base64}
    user-ttl: 7200000
    user-token-name: authentication
  auth:
    jwt:
      issuer: merchantbao
      audience: api-v1
  shipment:
    webservice:
      # SOAP WebService 独立信任域的服务间凭证（课程演示 + 模拟外部承运商对接）。
      # 未配置时 SOAP 端点拒绝全部查询；凭证不进前端、不进仓库明文。
      service-token: ${SHIPMENT_WS_TOKEN:}
  alioss:
    endpoint:${merchant.alioss.endpoint}
    access-key-id:${merchant.alioss.access-key-id}
    access-key-secret:${merchant.alioss.access-key-secret}
    bucket-name:${merchant.alioss.bucket-name}
  wechat:
    appid: ${merchant.wechat.appid}
    secret: ${merchant.wechat.secret}
  shop:
    address: ${merchant.shop.address}
  baidu:
    ak: ${merchant.baidu.ak}
