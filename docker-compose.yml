name: gba-dev

x-logging: &service-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    extra_hosts:
      # Use a dedicated IPv4-only alias; Docker Desktop's built-in name also has an IPv6 entry.
      - "host.docker.internal.v4:host-gateway"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/dev.conf:ro
      - ./docker/nginx/15-host-gateway.sh:/docker-entrypoint.d/15-host-gateway.sh:ro
    healthcheck:
      # Checks the proxy configuration, independently of host backend availability.
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *service-logging

  mysql:
    image: mysql:8.0.34
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gba_dev}
      MYSQL_USER: ${MYSQL_USER:-dev_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *service-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *service-logging

volumes:
  mysql_data:
  redis_data:
