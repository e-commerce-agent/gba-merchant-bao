# Included in the official image's http context.
map $http_x_request_id $dev_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
}

log_format dev_api escape=json
    '{"method":"$request_method","path":"$uri","request_id":"$dev_request_id",'
    '"status":$status,"request_time":"$request_time",'
    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time"}';

upstream dev_api {
    zone dev_api 64k;
    # Default equal-weight round robin; no application must be running at startup.
    server host.docker.internal:8080 max_fails=1 fail_timeout=5s;
    server host.docker.internal:8082 max_fails=1 fail_timeout=5s;
}

server {
    listen 80 default_server;
    server_name _;

    # Override the image's http-level default log (which includes the query).
    access_log /dev/stdout dev_api;
    # Standard request error messages also include the raw URI and query string.
    # Diagnose upstream failures, including 502/504, using the access log above.
    error_log /dev/null;

    # The existing 1 MiB knowledge file also needs multipart headers and fields.
    client_max_body_size 2m;
    gzip off;
    send_timeout 300s;

    location ~ ^/api(?:/|$) {
        # No URI suffix: forward /api and the original request URI unchanged.
        proxy_pass http://dev_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-Id $dev_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Encoding "";
        # Other headers (including Cookie, token and authentication) pass through.
        proxy_pass_request_headers on;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Never enable non_idempotent: sent POSTs and established streams aren't replayed.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    location / {
        return 404;
    }
}
