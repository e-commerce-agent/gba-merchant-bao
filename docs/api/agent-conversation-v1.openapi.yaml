components:
  schemas:
    ChatSession:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        merchantId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        title:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        createdAt:
          type: string
          format: date-time
          description: UTC ISO-8601，Z 后缀
          example: 2026-11-08T01:02:03.456Z
        updatedAt:
          type: string
          format: date-time
          description: UTC ISO-8601，Z 后缀
          example: 2026-11-08T01:02:03.456Z
        archivedAt:
          anyOf:
          - type: string
            format: date-time
            description: UTC ISO-8601，Z 后缀
            example: 2026-11-08T01:02:03.456Z
          - type: "null"
        activeRunId:
          anyOf:
          - type: string
            description: 正十进制 BIGINT 字符串，最大 9223372036854775807
            example: "300000000000000001"
            pattern: "^[1-9][0-9]{0,18}$"
          - type: "null"
        activeRunStatus:
          anyOf:
          - type: string
            enum:
            - STARTED
            - STREAMING
          - type: "null"
      required:
      - sessionId
      - merchantId
      - title
      - status
      - createdAt
      - updatedAt
      - archivedAt
      - activeRunId
      - activeRunStatus
    ChatMessage:
      type: object
      additionalProperties: false
      properties:
        messageId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        messageSeq:
          type: integer
          format: int64
          minimum: 1
        runId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        clientMessageId:
          anyOf:
          - type: string
          - type: "null"
        senderType:
          type: string
          enum:
          - USER
          - ASSISTANT
        content:
          type: string
        status:
          type: string
          enum:
          - STARTED
          - STREAMING
          - COMPLETED
          - CANCELLED
          - TIMED_OUT
          - FAILED
        errorCode:
          anyOf:
          - type: string
          - type: "null"
        inputTokens:
          anyOf:
          - type: integer
            format: int64
            minimum: 0
          - type: "null"
        outputTokens:
          anyOf:
          - type: integer
            format: int64
            minimum: 0
          - type: "null"
        createdAt:
          type: string
          format: date-time
          description: UTC ISO-8601，Z 后缀
          example: 2026-11-08T01:02:03.456Z
        completedAt:
          anyOf:
          - type: string
            format: date-time
            description: UTC ISO-8601，Z 后缀
            example: 2026-11-08T01:02:03.456Z
          - type: "null"
        sources:
          type: array
          description: 成功助手消息的来源快照；旧消息、USER、失败、取消、超时、无资料均为空数组
          items:
            $ref: "#/components/schemas/Source"
          maxItems: 5
      required:
      - messageId
      - messageSeq
      - runId
      - clientMessageId
      - senderType
      - content
      - status
      - errorCode
      - inputTokens
      - outputTokens
      - createdAt
      - completedAt
      - sources
    ChatRun:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        runId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        userMessageId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        messageId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        status:
          type: string
          enum:
          - STARTED
          - STREAMING
          - COMPLETED
          - CANCELLED
          - TIMED_OUT
          - FAILED
      required:
      - sessionId
      - runId
      - userMessageId
      - messageId
      - status
    Source:
      type: object
      additionalProperties: false
      description: 实际入模的参考片段快照；不代表逐句核验回答
      properties:
        documentId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        chunkId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        title:
          type: string
          maxLength: 200
        chunkNo:
          type: integer
          format: int32
          maximum: 200
          minimum: 1
        excerpt:
          type: string
          description: 最多300个 Unicode 码点，与实际入模片段一致
          maxLength: 300
      required:
      - documentId
      - chunkId
      - title
      - chunkNo
      - excerpt
    ChatDone:
      type: object
      additionalProperties: false
      description: "SSE event: done 的 data JSON；仅在成功正文及 sources 提交后发送"
      properties:
        version:
          type: string
          enum:
          - v1
        runId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        sessionId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        messageId:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
        requestId:
          type: string
        status:
          type: string
          enum:
          - COMPLETED
        usage:
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              inputTokens:
                anyOf:
                - type: integer
                  format: int64
                - type: "null"
              outputTokens:
                anyOf:
                - type: integer
                  format: int64
                - type: "null"
            required:
            - inputTokens
            - outputTokens
          - type: "null"
        sources:
          type: array
          description: 成功助手消息的来源快照；旧消息、USER、失败、取消、超时、无资料均为空数组
          items:
            $ref: "#/components/schemas/Source"
          maxItems: 5
      required:
      - version
      - runId
      - sessionId
      - messageId
      - requestId
      - status
      - usage
      - sources
    ChatError:
