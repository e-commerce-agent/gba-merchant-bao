    post:
      tags:
      - Agent conversation
      summary: 提交消息并生成 SSE，或返回同 key 同正文的原 run JSON
      description: 必须同时处理 text/event-stream 和 application/json。幂等先于 busy/归档判断；key
        相同正文不同返回 409，不重跑检索或生成。RAG 仅检索本商户 READY 资料；无匹配返回资料不足提示和空 sources，依赖失败为 error。done.data
        对应 ChatDone，正文与实际入模来源同事务提交；历史保留来源快照。客户端不能覆盖身份、system、role 或模型。断开后查历史，不支持 Last-Event-ID
        重放。citation/tool_call 留待未来扩展，本期不发送。
      operationId: sendChatMessage
      parameters:
      - name: X-Request-Id
        in: header
        description: 非法/缺失时服务器生成；所有帧与响应头使用相同值
        required: false
        schema:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          description: 正十进制 BIGINT 字符串，最大 9223372036854775807
          example: "300000000000000001"
          pattern: "^[1-9][0-9]{0,18}$"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                content:
                  type: string
                  description: 非空白；保留原文，限制按 Unicode 字符计数
                  maxLength: 4000
                  minLength: 1
                clientMessageId:
                  type: string
                  example: 00000000-0000-4000-8000-000000000001
                  pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
              required:
              - content
              - clientMessageId
        required: true
      responses:
        "200":
          description: 新 run 为 SSE；重复提交为 JSON 原标识。SSE 首帧 start，随后非空 token，最后仅 done
            或 error。done 前终态已提交。注释 heartbeat 不续期认证。
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              description: 包含 no-store
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRunEnvelope"
            text/event-stream:
              schema:
                type: string
              examples:
                completed:
                  summary: start → token → done；usage 未提供为 null
                  value: |+
                    id: 41:1
                    event: start
                    data: {"version":"v1","runId":"41","sessionId":"31","messageId":"61","requestId":"chat-example","userMessageId":"51"}

                    id: 41:2
                    event: token
                    data: {"version":"v1","runId":"41","sessionId":"31","messageId":"61","requestId":"chat-example","delta":"购买后七日内，未拆封商品可申请退货。"}

                    id: 41:3
                    event: done
                    data: {"version":"v1","runId":"41","sessionId":"31","messageId":"61","requestId":"chat-example","status":"COMPLETED","usage":null,"sources":[{"documentId":"610000000000000001","chunkId":"620000000000000001","title":"售后政策","chunkNo":1,"excerpt":"购买后七日内，未拆封商品可申请退货。"}]}

                noMatch:
                  summary: "无匹配直接提示资料不足；sources=[]，不调用生成模型"
                  value: |+
                    id: 41:1
                    event: start
                    data: {"version":"v1","runId":"41","sessionId":"31","messageId":"61","requestId":"chat-example","userMessageId":"51"}

                    id: 41:2
                    event: token
                    data: {"version":"v1","runId":"41","sessionId":"31","messageId":"61","requestId":"chat-example","delta":"当前资料中没有找到相关信息，请补充说明或联系店铺确认"}

                    id: 41:3
                    event: done
                    data: {"version":"v1","runId":"41","sessionId":"31","messageId":"61","requestId":"chat-example","status":"COMPLETED","usage":null,"sources":[]}

                timeout:
                  summary: start 后的超时终态；HTTP 已为 200
                  value: |+
                    id: 41:1
                    event: start
                    data: {"version":"v1","runId":"41","sessionId":"31","messageId":"61","requestId":"chat-example","userMessageId":"51"}

                    id: 41:2
                    event: error
                    data: {"version":"v1","runId":"41","sessionId":"31","messageId":"61","requestId":"chat-example","code":"TIMEOUT","message":"模型响应超时","terminalStatus":"TIMED_OUT"}

              x-sse-data-schemas:
                done:
                  $ref: "#/components/schemas/ChatDone"
        "400":
          description: 10001 参数无效；13001 上下文预算不足
