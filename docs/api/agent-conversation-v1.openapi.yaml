openapi: 3.1.0
info:
  title: Agent conversation API
  description: 消费者和员工仅访问本商户本人会话。Bearer 来自既有认证；禁用模型时仍可读历史。MySQL 为运行终态来源。所有响应 no-store。
  version: v1
servers:
- url: /
paths:
  /api/v1/chat/sessions:
    get:
      tags:
      - Agent conversation
      summary: 分页列出本人会话
      operationId: listChatSessions
      parameters:
      - name: X-Request-Id
        in: header
        description: 非法/缺失时服务器生成；所有帧与响应头使用相同值
        required: false
        schema:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: cursor
        in: query
        description: 不透明、资源绑定的游标；省略为首页，未知/重复参数拒绝
        schema:
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "200":
          description: 成功
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              description: 包含 no-store
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionPageEnvelope"
        "400":
          description: 10001 参数无效；13001 上下文预算不足
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              description: 包含 no-store
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
              example:
                code: 10001
                message: 10001 参数无效；13001 上下文预算不足
                data: null
                requestId: chat-example
        "401":
          description: 10002 Bearer 缺失/失效
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              description: 包含 no-store
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
              example:
                code: 10002
                message: 10002 Bearer 缺失/失效
                data: null
                requestId: chat-example
        "403":
          description: 10003 角色越权
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              description: 包含 no-store
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
              example:
                code: 10003
                message: 10003 角色越权
                data: null
                requestId: chat-example
        "404":
          description: 10004 不存在、跨商户或他人资源，统一不可见
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              description: 包含 no-store
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
              example:
                code: 10004
                message: 10004 不存在、跨商户或他人资源，统一不可见
                data: null
                requestId: chat-example
        "409":
          description: 13002 运行中 busy；13003 幂等正文冲突；13004 已归档
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              description: 包含 no-store
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
              example:
                code: 13002
                message: 13002 运行中 busy；13003 幂等正文冲突；13004 已归档
                data: null
                requestId: chat-example
        "406":
          description: 10001 无法协商成功 MIME
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              description: 包含 no-store
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
              example:
                code: 10001
                message: 10001 无法协商成功 MIME
                data: null
                requestId: chat-example
        "415":
