openapi: 3.1.0
info:
  title: Product module API
  description: |-
    公开商城与商户商品目录。公开 GET /api/v1/stores/{storeSlug}/products、/products/{productId}、/skus/{skuId} 匿名访问；
    storeSlug 按认证编码规则解析 ACTIVE 商户，初期复用 merchantCode，只返回 PUBLISHED 商品与 ACTIVE SKU。
    公开请求忽略附带 token，不推进会话；原 /public 商品路径不再提供。员工登录与内部商家编码保持不变。
    公开列表/详情内的 SKU 及 SKU 详情包含 inStock 布尔，当前可售库存大于零为 true，缺少库存行或可售为零为 false。
    目录缓存不保存库存状态，每次请求组合当前库存；公开响应不暴露精确数量、预占量或流水，精确库存仅员工可读。
    登录读取按角色过滤可见性，写操作仅限商户员工，身份一律来自服务端 Actor。
    ID 为十进制字符串，时间为 UTC ISO-8601，所有响应 no-store。错误码：10001 参数无效、10002 未认证、10003 越权、10004 不存在/跨商户统一不可见、10009 冲突、10500 内部错误。
  version: v1
servers:
- url: http://localhost:62408
  description: Generated server url
tags:
- name: shipment-v1
  description: "Read-only shipment query; Bearer access required. Errors reuse the\
    \ common segments: 400/10001, 401/10002, 403/10003, 404/10004 (missing, cross-tenant\
    \ and foreign orders are indistinguishable), 500/10500. IDs are strings and times\
    \ are UTC. Tracking numbers are never a lookup key."
- name: auth-v1
  description: "Stateless auth; responses use Cache-Control: no-store. Errors: 400/10001\
    \ or 11002, 401/10002 or 11001, 403/10003, 404/10004, 409/10009, 429/11003 with\
    \ Retry-After, 503/11501 or 11502. IDs are strings and times are UTC."
